name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontendTests:
    runs-on: ubuntu-latest
    name: ubuntu-latest / JavaScript
    env:
      nodeVersion: 18
      phpVersion: '8.3'
      extensions: curl, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, sqlite3, xml, zip
      key: berescms-cache-main
    steps:
      - name: Checkout changes
        uses: actions/checkout@v3

      - name: Setup extension cache
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.phpVersion }}
          extensions: ${{ env.extensions }}
          key: ${{ env.key }}

      - name: Cache extensions
        uses: actions/cache@v3
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpVersion }}
          extensions: ${{ env.extensions }}

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.nodeVersion }}

      - name: Setup dependency cache
        id: composercache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Reset modules
        run: |
          git reset --hard
          git clean -fd

      - name: Run post-update Composer scripts
        run: php artisan package:discover

      - name: Run tests
        run: |
          php artisan mix:install
          php artisan mix:run module-system test

  phpUnitTests:
    strategy:
      max-parallel: 2
      matrix:
        phpVersion: ['8.3', '8.4']
      fail-fast: false
    runs-on: ubuntu-latest
    name: ubuntu-latest / PHP ${{ matrix.phpVersion }}
    env:
      extensions: curl, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, sqlite3, xml, zip
      key: berescms-cache-main
    steps:
      - name: Checkout changes
        uses: actions/checkout@v3

      - name: Setup extension cache
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.phpVersion }}
          extensions: ${{ env.extensions }}
          key: ${{ env.key }}

      - name: Cache extensions
        uses: actions/cache@v3
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.phpVersion }}
          extensions: ${{ env.extensions }}

      - name: Setup dependency cache
        id: composercache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Reset modules
        run: |
          git reset --hard
          git clean -fd

      - name: Run post-update Composer scripts
        run: php artisan package:discover

      - name: Run Linting and Tests
        run: |
          composer lint
          vendor/bin/phpunit -c modules/storm/phpunit.xml
          php artisan winter:test -m system -m backend -m cms
